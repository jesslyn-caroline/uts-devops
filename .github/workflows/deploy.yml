name: Publish 

on:
  push:
    branches:
      - main

jobs:
  push_to_registry:
    name: Push 
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t jesslyncaroline/uts-devsops-frontend:1.0.0 .

      - name: Push image
        run: docker push jesslyncaroline/uts-devsops-frontend:1.0.0